<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="gardenSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="60%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>
  </defs>

  <!-- Bright Sunny Garden Sky -->
  <rect width="600" height="450" fill="url(#gardenSky)"/>

  <!-- Happy Smiling Sun with Rosy Cheeks -->
  <g transform="translate(100, 90)">
    <circle cx="0" cy="0" r="45" fill="#FCD34D"/>
    <circle cx="-14" cy="-4" r="3.5" fill="#4A2535"/>
    <circle cx="14" cy="-4" r="3.5" fill="#4A2535"/>
    <circle cx="-20" cy="6" r="6" fill="#FCA5A5" opacity="0.8"/>
    <circle cx="20" cy="6" r="6" fill="#FCA5A5" opacity="0.8"/>
    <path d="M -8 10 Q 0 18 8 10" stroke="#4A2535" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Sunbeams -->
    <line x1="0" y1="-55" x2="0" y2="-68" stroke="#FCD34D" stroke-width="4" stroke-linecap="round"/>
    <line x1="40" y1="-40" x2="50" y2="-50" stroke="#FCD34D" stroke-width="4" stroke-linecap="round"/>
    <line x1="55" y1="0" x2="68" y2="0" stroke="#FCD34D" stroke-width="4" stroke-linecap="round"/>
    <line x1="40" y1="40" x2="50" y2="50" stroke="#FCD34D" stroke-width="4" stroke-linecap="round"/>
    <line x1="-40" y1="-40" x2="-50" y2="-50" stroke="#FCD34D" stroke-width="4" stroke-linecap="round"/>
    <line x1="-55" y1="0" x2="-68" y2="0" stroke="#FCD34D" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Fluffy White Clouds -->
  <ellipse cx="440" cy="110" rx="70" ry="25" fill="#FFFFFF" opacity="0.9"/>
  <ellipse cx="490" cy="98" rx="50" ry="22" fill="#FFFFFF" opacity="0.9"/>
  <ellipse cx="390" cy="115" rx="40" ry="20" fill="#FFFFFF" opacity="0.9"/>

  <!-- Rolling Meadow Hills -->
  <path d="M 0 310 Q 200 240 400 290 Q 520 310 600 280 L 600 450 L 0 450 Z" fill="#BBF7D0"/>
  <path d="M 0 350 Q 240 300 480 340 Q 540 350 600 330 L 600 450 L 0 450 Z" fill="#86EFAC"/>

  <!-- Blooming Garden Flowers -->
  <!-- Giant Happy Sunflower -->
  <g transform="translate(140, 270)">
    <line x1="0" y1="0" x2="0" y2="100" stroke="#16A34A" stroke-width="6"/>
    <!-- Leaves -->
    <path d="M 0 50 Q -30 40 -20 60 Z" fill="#22C55E"/>
    <path d="M 0 70 Q 30 60 20 80 Z" fill="#22C55E"/>
    <!-- Petals -->
    <circle cx="0" cy="0" r="38" fill="#FCD34D"/>
    <!-- Flower Center with smile -->
    <circle cx="0" cy="0" r="22" fill="#92400E"/>
    <circle cx="-7" cy="-3" r="2" fill="#FFFFFF"/>
    <circle cx="7" cy="-3" r="2" fill="#FFFFFF"/>
    <path d="M -5 5 Q 0 9 5 5" stroke="#FFFFFF" stroke-width="2" fill="none"/>
  </g>

  <!-- Big Pink Tulips & Daisies -->
  <g transform="translate(460, 290)">
    <line x1="0" y1="0" x2="0" y2="80" stroke="#16A34A" stroke-width="5"/>
    <circle cx="0" cy="0" r="16" fill="#F472B6"/>
    <circle cx="-16" cy="0" r="12" fill="#F472B6"/>
    <circle cx="16" cy="0" r="12" fill="#F472B6"/>
    <circle cx="0" cy="-16" r="12" fill="#F472B6"/>
    <circle cx="0" cy="0" r="8" fill="#FEF08A"/>
  </g>

  <!-- Hello Kitty in the Center Waving with Flower Pin -->
  <g transform="translate(300, 260)">
    <!-- Ears -->
    <polygon points="-36,-10 -46,-40 -20,-24" fill="#FFFFFF" stroke="#4A2535" stroke-width="3"/>
    <polygon points="36,-10 46,-40 20,-24" fill="#FFFFFF" stroke="#4A2535" stroke-width="3"/>
    <!-- Head -->
    <ellipse cx="0" cy="0" rx="46" ry="36" fill="#FFFFFF" stroke="#4A2535" stroke-width="3.5"/>
    <!-- Rosy Cheeks -->
    <ellipse cx="-26" cy="6" rx="7" ry="4" fill="#FFD1DC"/>
    <ellipse cx="26" cy="6" rx="7" ry="4" fill="#FFD1DC"/>
    <!-- Whiskers -->
    <line x1="-48" y1="-2" x2="-36" y2="0" stroke="#4A2535" stroke-width="2"/>
    <line x1="-50" y1="6" x2="-38" y2="6" stroke="#4A2535" stroke-width="2"/>
    <line x1="48" y1="-2" x2="36" y2="0" stroke="#4A2535" stroke-width="2"/>
    <line x1="50" y1="6" x2="38" y2="6" stroke="#4A2535" stroke-width="2"/>
    <!-- Eyes -->
    <ellipse cx="-15" cy="1" rx="3.5" ry="5.5" fill="#4A2535"/>
    <circle cx="-16" cy="-1" r="1.5" fill="#FFFFFF"/>
    <ellipse cx="15" cy="1" rx="3.5" ry="5.5" fill="#4A2535"/>
    <circle cx="14" cy="-1" r="1.5" fill="#FFFFFF"/>
    <!-- Yellow Nose -->
    <ellipse cx="0" cy="7" rx="5" ry="3.5" fill="#FCD34D" stroke="#4A2535" stroke-width="1.5"/>
    <!-- Signature Pink Bow -->
    <g transform="translate(24, -30) scale(0.45)">
      <ellipse cx="20" cy="20" rx="16" ry="12" fill="#FF3366" stroke="#4A2535" stroke-width="5"/>
      <ellipse cx="50" cy="20" rx="16" ry="12" fill="#FF3366" stroke="#4A2535" stroke-width="5"/>
      <circle cx="35" cy="20" r="10" fill="#FF8FAB" stroke="#4A2535" stroke-width="5"/>
    </g>
    <!-- Cute Pink Overalls Body Waving -->
    <ellipse cx="0" cy="55" rx="30" ry="24" fill="#FF6B8B" stroke="#4A2535" stroke-width="3"/>
    <ellipse cx="-28" cy="40" rx="9" ry="7" fill="#FFFFFF" stroke="#4A2535" stroke-width="2.5" transform="rotate(-35 -28 40)"/>
    <ellipse cx="28" cy="40" rx="9" ry="7" fill="#FFFFFF" stroke="#4A2535" stroke-width="2.5" transform="rotate(35 28 40)"/>
  </g>

  <!-- Floating Butterfly & Hearts -->
  <text x="210" y="210" font-size="20">🦋</text>
  <text x="390" y="200" font-size="22" fill="#FF3366">💖</text>

  <!-- Caption Pill in Art -->
  <rect x="180" y="405" width="240" height="30" rx="15" fill="#FFFFFF" stroke="#FF8FAB" stroke-width="2"/>
  <text x="300" y="425" font-family="'Fredoka', sans-serif" font-size="13" font-weight="bold" fill="#4A2535" text-anchor="middle">
    That Big Beautiful Smile 😊🌸
  </text>
</svg>

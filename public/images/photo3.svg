<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="nightBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D1B2D"/>
      <stop offset="60%" stop-color="#4A2535"/>
      <stop offset="100%" stop-color="#703850"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B8B"/>
      <stop offset="100%" stop-color="#89CFF0"/>
    </linearGradient>
  </defs>

  <!-- Midnight Purple/Berry Sky -->
  <rect width="600" height="450" fill="url(#nightBg)"/>

  <!-- Glowing Crescent Moon & Stars -->
  <path d="M 500 60 A 35 35 0 0 0 535 95 A 40 40 0 1 1 500 60 Z" fill="#FEF08A"/>
  <circle cx="120" cy="80" r="3" fill="#FFFFFF"/>
  <circle cx="220" cy="60" r="2.5" fill="#FFD1DC"/>
  <circle cx="340" cy="90" r="3" fill="#FFFFFF"/>
  <circle cx="430" cy="120" r="2" fill="#FEF08A"/>
  <text x="280" y="70" font-size="16" fill="#FEF08A">✦</text>
  <text x="160" y="120" font-size="18" fill="#FF8FAB">✧</text>

  <!-- Pastel Neon Boba Shop Sign -->
  <rect x="180" y="110" width="240" height="55" rx="16" fill="#FFFFFF" stroke="url(#neonGlow)" stroke-width="4"/>
  <text x="300" y="146" font-family="'Fredoka', sans-serif" font-size="20" font-weight="bold" fill="#4A2535" text-anchor="middle">
    SWEET BOBA CAFE 🧋
  </text>
  <!-- Kitty ears on sign -->
  <polygon points="210,110 225,90 240,110" fill="#FFFFFF" stroke="#FF6B8B" stroke-width="3"/>
  <polygon points="360,110 375,90 390,110" fill="#FFFFFF" stroke="#FF6B8B" stroke-width="3"/>

  <!-- Two Huge Adorable Boba Cups on Counter -->
  <!-- Left Boba Cup: Brown Sugar Milk Tea with Cat Paw Straw -->
  <g transform="translate(190, 200)">
    <!-- Cup Body -->
    <path d="M 15 20 L 25 150 C 26 165 74 165 75 150 L 85 20 Z" fill="#FFE5D9" stroke="#FFFFFF" stroke-width="4"/>
    <!-- Dome Lid -->
    <path d="M 10 20 C 10 -15 90 -15 90 20 Z" fill="#FFFFFF" stroke="#4A2535" stroke-width="3" opacity="0.9"/>
    <!-- Brown Sugar Swirls -->
    <path d="M 22 100 Q 50 120 78 95" stroke="#9A3412" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
    <path d="M 24 125 Q 50 140 76 125" stroke="#9A3412" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
    <!-- Tapioca Pearls -->
    <circle cx="35" cy="142" r="6" fill="#4A2535"/>
    <circle cx="50" cy="146" r="6.5" fill="#4A2535"/>
    <circle cx="65" cy="140" r="6" fill="#4A2535"/>
    <circle cx="42" cy="132" r="5.5" fill="#4A2535"/>
    <circle cx="58" cy="133" r="6" fill="#4A2535"/>
    <!-- Giant Straw -->
    <line x1="50" y1="-25" x2="50" y2="135" stroke="#FF8FAB" stroke-width="10" stroke-linecap="round"/>
    <!-- Kitty Face Sticker on Cup -->
    <ellipse cx="50" cy="70" rx="16" ry="12" fill="#FFFFFF" stroke="#4A2535" stroke-width="2"/>
    <circle cx="44" cy="70" r="1.5" fill="#4A2535"/>
    <circle cx="56" cy="70" r="1.5" fill="#4A2535"/>
    <circle cx="50" cy="73" r="1.5" fill="#FCD34D"/>
    <text x="50" y="58" font-size="10" text-anchor="middle">🎀</text>
  </g>

  <!-- Right Boba Cup: Taro / Strawberry Milk with Heart Straw -->
  <g transform="translate(310, 200)">
    <!-- Cup Body -->
    <path d="M 15 20 L 25 150 C 26 165 74 165 75 150 L 85 20 Z" fill="#FFD1DC" stroke="#FFFFFF" stroke-width="4"/>
    <!-- Dome Lid -->
    <path d="M 10 20 C 10 -15 90 -15 90 20 Z" fill="#FFFFFF" stroke="#4A2535" stroke-width="3" opacity="0.9"/>
    <!-- Tapioca Pearls -->
    <circle cx="35" cy="142" r="6" fill="#4A2535"/>
    <circle cx="50" cy="146" r="6.5" fill="#4A2535"/>
    <circle cx="65" cy="140" r="6" fill="#4A2535"/>
    <circle cx="42" cy="132" r="5.5" fill="#4A2535"/>
    <circle cx="58" cy="133" r="6" fill="#4A2535"/>
    <!-- Giant Baby Blue Straw -->
    <line x1="50" y1="-25" x2="50" y2="135" stroke="#89CFF0" stroke-width="10" stroke-linecap="round"/>
    <!-- Strawberry Sticker -->
    <circle cx="50" cy="72" r="12" fill="#FF4D6D"/>
    <polygon points="46,60 50,55 54,60" fill="#86EFAC"/>
    <circle cx="48" cy="72" r="1.5" fill="#FEF08A"/>
    <circle cx="52" cy="74" r="1.5" fill="#FEF08A"/>
  </g>

  <!-- Boba Counter Table Bar -->
  <rect x="0" y="380" width="600" height="70" fill="#FFF9FA" stroke="#4A2535" stroke-width="4"/>

  <!-- Caption Pill in Art -->
  <rect x="180" y="405" width="240" height="30" rx="15" fill="#FFFFFF" stroke="#FF8FAB" stroke-width="2"/>
  <text x="300" y="425" font-family="'Fredoka', sans-serif" font-size="13" font-weight="bold" fill="#4A2535" text-anchor="middle">
    Late Night Boba Runs 🧋🌙
  </text>
</svg>

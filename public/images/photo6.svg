<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="partyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE4EC"/>
      <stop offset="50%" stop-color="#FFF0F5"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
  </defs>

  <!-- Celebration Party Ballroom Wall -->
  <rect width="600" height="450" fill="url(#partyBg)"/>

  <!-- Party Bunting Flags -->
  <path d="M 0 40 Q 150 90 300 40 Q 450 90 600 40" fill="none" stroke="#4A2535" stroke-width="2.5"/>
  <polygon points="50,60 75,100 100,60" fill="#FF6B8B"/>
  <polygon points="120,68 145,108 170,68" fill="#FCD34D"/>
  <polygon points="190,70 215,110 240,70" fill="#89CFF0"/>
  <polygon points="260,65 285,105 310,65" fill="#C084FC"/>
  <polygon points="330,68 355,108 380,68" fill="#FF6B8B"/>
  <polygon points="400,70 425,110 450,70" fill="#FCD34D"/>
  <polygon points="470,65 495,105 520,65" fill="#89CFF0"/>

  <!-- Floating Helium Pastel Balloons -->
  <!-- Left Balloon Cluster -->
  <g transform="translate(80, 160)">
    <ellipse cx="20" cy="0" rx="22" ry="28" fill="#FF8FAB" opacity="0.9"/>
    <line x1="20" y1="28" x2="30" y2="130" stroke="#4A2535" stroke-width="1.5"/>
    <ellipse cx="45" cy="-20" rx="20" ry="26" fill="#89CFF0" opacity="0.9"/>
    <line x1="45" y1="6" x2="30" y2="130" stroke="#4A2535" stroke-width="1.5"/>
    <ellipse cx="0" cy="-25" rx="20" ry="26" fill="#FCD34D" opacity="0.9"/>
    <line x1="0" y1="1" x2="30" y2="130" stroke="#4A2535" stroke-width="1.5"/>
  </g>

  <!-- Right Balloon Cluster -->
  <g transform="translate(460, 160)">
    <ellipse cx="20" cy="0" rx="22" ry="28" fill="#C084FC" opacity="0.9"/>
    <line x1="20" y1="28" x2="20" y2="130" stroke="#4A2535" stroke-width="1.5"/>
    <ellipse cx="45" cy="-20" rx="20" ry="26" fill="#FF8FAB" opacity="0.9"/>
    <line x1="45" y1="6" x2="20" y2="130" stroke="#4A2535" stroke-width="1.5"/>
    <ellipse cx="0" cy="-25" rx="20" ry="26" fill="#86EFAC" opacity="0.9"/>
    <line x1="0" y1="1" x2="20" y2="130" stroke="#4A2535" stroke-width="1.5"/>
  </g>

  <!-- Big Party Table -->
  <ellipse cx="300" cy="380" rx="260" ry="60" fill="#FFFFFF" stroke="#4A2535" stroke-width="4"/>
  <ellipse cx="300" cy="375" rx="250" ry="52" fill="#FFF9FA"/>

  <!-- Grand 3-Tiered Birthday Cake in Center -->
  <g transform="translate(300, 240)">
    <!-- Bottom Tier -->
    <rect x="-80" y="40" width="160" height="50" rx="8" fill="#FFF0F5" stroke="#4A2535" stroke-width="3"/>
    <path d="M -80 55 Q -60 70 -40 55 Q -20 70 0 55 Q 20 70 40 55 Q 60 70 80 55 L 80 40 L -80 40 Z" fill="#FF8FAB"/>
    <!-- Middle Tier -->
    <rect x="-55" y="-5" width="110" height="48" rx="8" fill="#FFFFFF" stroke="#4A2535" stroke-width="3"/>
    <path d="M -55 10 Q -35 25 -15 10 Q 5 25 25 10 Q 45 25 55 10 L 55 -5 L -55 -5 Z" fill="#FF6B8B"/>
    <!-- Top Tier -->
    <rect x="-35" y="-45" width="70" height="42" rx="6" fill="#FFF0F5" stroke="#4A2535" stroke-width="3"/>
    <path d="M -35 -30 Q -15 -18 5 -30 Q 25 -18 35 -30 L 35 -45 L -35 -45 Z" fill="#FF8FAB"/>
    <!-- Golden Crown Cake Topper -->
    <polygon points="-20,-55 -25,-75 -10,-65 0,-80 10,-65 25,-75 20,-55" fill="#FCD34D" stroke="#4A2535" stroke-width="2"/>
    <!-- Candles with glowing flames -->
    <rect x="-18" y="-60" width="4" height="15" fill="#89CFF0"/>
    <circle cx="-16" cy="-64" r="3" fill="#F59E0B"/>
    <rect x="14" y="-60" width="4" height="15" fill="#89CFF0"/>
    <circle cx="16" cy="-64" r="3" fill="#F59E0B"/>
    <rect x="-2" y="-65" width="4" height="18" fill="#FF6B8B"/>
    <circle cx="0" cy="-70" r="3.5" fill="#F59E0B"/>
  </g>

  <!-- Confetti Rain Drops Everywhere -->
  <rect x="120" y="80" width="8" height="4" rx="2" fill="#FF6B8B" transform="rotate(25 120 80)"/>
  <rect x="230" y="110" width="8" height="4" rx="2" fill="#FCD34D" transform="rotate(-35 230 110)"/>
  <rect x="370" y="90" width="8" height="4" rx="2" fill="#89CFF0" transform="rotate(45 370 90)"/>
  <rect x="470" y="120" width="8" height="4" rx="2" fill="#C084FC" transform="rotate(-20 470 120)"/>
  <circle cx="180" cy="180" r="3" fill="#FF3366"/>
  <circle cx="410" cy="190" r="3" fill="#FCD34D"/>
  <circle cx="280" cy="140" r="3.5" fill="#89CFF0"/>

  <!-- Caption Pill in Art -->
  <rect x="160" y="405" width="280" height="30" rx="15" fill="#FFFFFF" stroke="#FF8FAB" stroke-width="2"/>
  <text x="300" y="425" font-family="'Fredoka', sans-serif" font-size="13" font-weight="bold" fill="#4A2535" text-anchor="middle">
    Making Birthday Wishes Come True 🎂👑
  </text>
</svg>
